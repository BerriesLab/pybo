[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyBO"
version = "0.3.0"
description = "A Python library for Multi-Objective Bayesian Optimization"
readme = "readme.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Davide Beretta", email = "mail.davide.beretta@gmail.com" }
]
dependencies = [
    "numpy >= 2.2",
    "botorch == 0.13.0",
    "matplotlib >= 3.10",
    "scipy >= 1.15",
    "scikit-optimize >= 0.10",
    "scikit-learn >= 1.6",
    "gpytorch == 1.14",
    "torch == 2.8.0",
    "sympy == 1.14.0",
    "pandas >= 2.3",
    "imageio >= 2.37",
    "tqdm >= 4.67",
    "PyYAML >= 6.0"
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# The figure settings are YAML, not Python: without this they are dropped from a
# non-editable install and fig_cfg cannot resolve.
[tool.setuptools.package-data]
"pybo.plotters.figure_settings" = ["*.yaml", "publisher_styles/*.yaml"]
"pybo.plotters.figure_settings_app" = ["*.yaml", "user_styles/*.yaml"]
