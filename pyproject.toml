[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyBO"
version = "0.3.0"
description = "A Python library for Multi-Objective Bayesian Optimization"
readme = "readme.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Davide Beretta", email = "mail.davide.beretta@gmail.com" }
]
dependencies = [
    "numpy >= 2.2",
    "botorch == 0.13.0",
    "matplotlib >= 3.10",
    "scipy >= 1.15",
    "scikit-optimize >= 0.10",
    "scikit-learn >= 1.6",
    "gpytorch == 1.14",
    "torch == 2.8.0",
    "sympy == 1.14.0",
    "pandas >= 2.3",
    "imageio >= 2.37",
    "tqdm >= 4.67",
    # Sandboxed evaluation of the campaign plots' --constraint expressions.
    "asteval >= 1.0"
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.0",
]
# Qt, for pybo_gui.gui only. Optional: the library and the analysis modules the GUI
# launches are all runnable without it.
gui = [
    "PySide6 >= 6.7",
]

[tool.setuptools.packages.find]
where = ["src"]

