# pyBO figure settings — this project's domain-specific defaults.
#
# Merged on top of the reusable package defaults
# (pybo/plotters/figure_settings/defaults.yaml):
#   package defaults -> THIS file -> publisher style (--style, default ieee_double)
#
# Every block below is the exact keyword mapping matplotlib receives; the plotters
# spread it unchanged (`**fig_cfg["gp"]["mean"]`) and hold no style values of their own.
# Colours are declared once under `palette` and pulled in by YAML anchor (&name / *name),
# so a hue is edited in one place.

# --- Figure aspect ratios (width / height) ---
# Shape only, never size: the physical width comes from column_width_in (package /
# publisher style), and the height is derived as width / aspect. fig_cfg["figsize"][name]
# (the [w, h] in inches every plotter reads) is built from these in config.py.
# One key per plotter; 1.143 reproduces the 8:7 every plotter used before these
# settings existed.
aspect:
  experiment_1d: 1.143              # Experiment1DPlotter
  experiment_2d: 1.143              # Experiment2DPlotter
  pareto_front_2d: 1.143            # ParetoFront2DPlotter
  acqf_1d: 1.143                    # Acqf1DPlotter
  acqf_2d: 1.143                    # Acqf2DPlotter
  evolution: 1.143                  # EvolutionPlotter (one per parameter / result)
  best_value: 1.143                 # BestValuePlotter
  hypervolume: 1.143                # HypervolumePlotter
  hypervolume_improvement: 1.143    # HypervolumeImprovementPlotter
  elapsed_time: 1.143               # ElapsedTimePlotter

# --- Sections whose `linewidth` follows linewidth_scale ---
# Publisher styles thin every stroke on a narrow column (e.g. 0.65 for a 3.5 in
# journal column); config.py walks exactly these sections. Marker sizes are absolute
# and are NOT scaled — a style that needs smaller markers overrides the `s` /
# `markersize` values below directly.
scaled_sections: [refline, gp, next_X, metrics, evolution]

# --- Colormaps ---
# Every surface and z-coloured scatter in pyBO encodes magnitude (a posterior mean, an
# acquisition value, a parameter), so they all take `sequential`, which must be a single
# hue light->dark. Before these settings existed four plotters hardcoded 'coolwarm' and
# Acqf2DPlotter used 'viridis'; viridis is the correct one for magnitude (perceptually
# uniform and colourblind-safe), so it is now the default for all of them. Set this to
# coolwarm to restore the old look.
# `diverging` is here for data with a meaningful midpoint and is not currently used.
cmap:
  sequential: viridis
  diverging: coolwarm

# --- Semantic palette --------------------------------------------------------
# The single source of truth for colour; every block below refers to these by anchor.
#
# COLOURBLIND SAFETY — read before editing, and re-measure if you do.
# Pairwise separation measured in OKLab (dE x100) under deuteranopia/protanopia:
#   feasible / pareto        9.1     floor  - legible ONLY via distinct markers
#   feasible / infeasible   11.2     floor  - legible ONLY via distinct markers
#   gp_mean  / future       11.7     floor  - legible via linestyle + marker
# Six simultaneous categorical hues cannot all reach the dE >= 15 comfort target under
# deuteranopia; that is a property of the colour space, not a fixable choice. The floor
# (dE >= 8) is therefore held by the markers below acting as secondary encoding: if you
# change a colour, keep its marker distinct or the plots stop being colourblind-legible.
palette:
  feasible: &feasible "#2ecc71"        # Emerald green  - feasible observations
  infeasible: &infeasible "#e74c3c"    # Alizarin red   - infeasible observations
  pareto: &pareto "#f39c12"            # Orange         - Pareto front / best value
  gp_mean: &gp_mean "#2980b9"          # Belize blue    - GP posterior mean and bands
  ground_truth: &ground_truth "#2c3e50"  # Midnight blue - dense true-function background
  future: &future "#7B3FF2"            # Violet         - proposed next X, forward arrows
  edge: &edge black                    # Marker outline

# --- Observations (the measured points) ---
observation:
  feasible:   {marker: o,   facecolor: *feasible,   edgecolor: *edge, s: 64,  alpha: 0.8, label: Feasible Obs}
  infeasible: {marker: X,   facecolor: *infeasible, edgecolor: *edge, s: 64,  alpha: 0.8, label: Infeasible Obs}
  pareto:     {marker: "*", facecolor: *pareto,     edgecolor: *edge, s: 192, alpha: 0.8, label: Pareto Obs}
  best_value: {marker: "*", facecolor: *pareto,     edgecolor: *edge, s: 192, alpha: 0.8, label: Best Obs}

# --- Ground truth (the dense true-function background: hundreds of tiny points) ---
ground_truth:
  feasible:   {marker: o,   facecolor: *ground_truth, edgecolor: null, s: 1, alpha: 0.25, label: Feasible GT}
  infeasible: {marker: x,   facecolor: *infeasible,   edgecolor: null, s: 1, alpha: 0.15, label: Infeasible GT}
  pareto:     {marker: "*", facecolor: *pareto, edgecolor: *edge, linewidths: 0.6, s: 3, alpha: 0.7, label: Pareto GT}
  best_value: {marker: "*", facecolor: *pareto, edgecolor: *edge, linewidths: 0.6, s: 3, alpha: 0.7, label: Best GT Value}

# --- GP posterior (1D plots); bands fade as they widen ---
gp:
  mean:        {color: *gp_mean, label: 'GP $\mu$'}
  band_1sigma: {color: *gp_mean, alpha: 0.10, label: 'GP $\pm 1 \sigma$'}
  band_2sigma: {color: *gp_mean, alpha: 0.05, label: 'GP $\pm 2 \sigma$'}
  band_3sigma: {color: *gp_mean, alpha: 0.02, label: 'GP $\pm 3 \sigma$'}

# --- The proposed next X ---
next_X:
  line_1d:   {color: *future, linestyle: ":", linewidth: 2, label: 'New $X$'}
  marker_2d: {marker: "*", facecolor: *future, edgecolors: *edge, s: 64, alpha: 0.8, label: Next X}

# --- Trajectory arrows between successive proposals ---
# `past` is drawn over the coloured surface, so it stays white for contrast.
arrow:
  future: {arrowstyle: "->", color: *future, lw: 1.5, alpha: 0.8, shrinkA: 3, shrinkB: 3,
           connectionstyle: "arc3,rad=0.1", ls: "--"}
  past:   {arrowstyle: "->", color: white,   lw: 1.5, alpha: 0.8, shrinkA: 3, shrinkB: 3,
           connectionstyle: "arc3,rad=0.1"}

# --- Acquisition function trace (1D) ---
acqf:
  line_1d: {color: *edge, s: 1, label: "Acqf."}

# --- Metrics panels (best value, hypervolume, HVI, elapsed time) ---
metrics:
  line: {marker: o, markerfacecolor: *pareto, markeredgecolor: *edge, markersize: 8, linestyle: "-"}

# --- Evolution panels (one per parameter / objective / constraint) ---
evolution:
  scatter:         {marker: o, color: *pareto, edgecolor: *edge, s: 64, alpha: 1, linestyle: "-"}
  interconnection: {color: gray, linestyle: "-", linewidth: 1, alpha: 0.2}

# --- Reference lines ---
refline:
  initial_samples: {linestyle: "--", linewidth: 1, color: *edge, alpha: 0.5}
