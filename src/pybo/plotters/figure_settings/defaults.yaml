# Package default figure settings — generic, domain-agnostic knobs only.
#
# This is the base of the reusable figure-settings package. The host application adds
# its own settings (plot aspect ratios, palettes, signal/reference styling, ...) in
# figure_settings_app/defaults.yaml, then publisher and user styles overlay on top:
#   package defaults -> app defaults -> publisher style -> user style
# See configs/figure_settings/config.py. Keep this file free of app-specific keys.

dpi: 600

# Padding (in font-size units) the plotters pass to tight_layout. matplotlib's
# default is 1.08; a smaller value trims the white border around the axes while
# keeping the figure at its exact figsize (no save-time cropping).
layout_pad: 0.4

# Physical width of every figure, in inches (height follows each plot's aspect ratio).
# Publisher styles override this with the journal's column width.
column_width_in: 10.0

# Multiplies all line widths (traces, grid, reference lines, marker edges). 1.0 = no
# scaling. Publisher styles thin lines for small columns (e.g. 0.65).
linewidth_scale: 1.0

font:
  label: 10
  legend: 9
  title: 11

# --- Axes grid style ---
grid:
  linestyle: "--"
  linewidth: 0.4
  alpha: 0.3

# --- Legend style ---
legend:
  loc: upper right
  frameon: true
  framealpha: 0.7

# --- Scatter style ---
scatter:
  marker_size: 45
  edge_color: black
  edge_width: 0.5
  alpha: 0.75

# --- Histogram / distribution panels (generic bar/smooth/peak styling) ---
histogram:
  bar:    {color: steelblue, alpha: 0.6}
  smooth: {color: navy,      linewidth: 1.0}
  peak:   {color: gray,      linestyle: ":", linewidth: 0.8, alpha: 0.5}

# --- matplotlib rcParams (font family, spines, savefig, ...) ---
# Empty base = matplotlib defaults. Publisher/user styles override these; they are
# pushed into matplotlib.rcParams by config.py (values the plotters do not pass).
rcparams: {}
